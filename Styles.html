<style>
:root{--ink:#17202a;--muted:#65727e;--paper:#f5f2eb;--card:#fff;--line:#d9d4c9;--accent:#243b53;--soft:#e9eef2}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}button,input,textarea{font:inherit}.topbar{height:72px;padding:0 max(24px,5vw);display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topbar div{display:flex;gap:12px;align-items:baseline}.topbar span{color:var(--muted);font-size:13px}.topbar button,.actions button{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:10px 18px;cursor:pointer}main{max-width:1180px;margin:auto;padding:56px 24px 80px}.hero{max-width:760px}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--muted)}h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,68px);line-height:1.02;margin:12px 0 18px;font-weight:500}.hero>p:not(.eyebrow){font-size:18px;color:var(--muted);line-height:1.6}.search{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;gap:10px}.search input{width:100%;border:0;outline:0;background:transparent}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 34px}.filter{border:1px solid var(--line);background:transparent;padding:8px 12px;border-radius:999px;cursor:pointer;text-transform:capitalize}.filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.text-card{text-align:left;min-height:180px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:22px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.18s transform,.18s box-shadow}.text-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(23,32,42,.08)}.text-card:disabled{opacity:.55;cursor:not-a
